        <p>
          NJR CELL (juga dikenal sebagai NJRCELL) menyediakan layanan Mini ATM berbasis perangkat EDC dengan bantuan petugas untuk menjelaskan dan mengarahkan jenis transaksi: tarik tunai kartu bank, setor tunai, transfer antarbank, fasilitas Agen BRILink (ID: 12400836) dan jaringan ATM Bersama yang tersedia, fasilitas Mandiri Agen (ID: 2407196), pencairan bantuan sosial PKH &amp; BPNT menggunakan kartu bantuan yang kompatibel, pembayaran BRIVA, cicilan bank yang didukung, pencairan saldo berbagai e-wallet tanpa biaya tambahan, pulsa, dan paket internet di Kabupaten Ciamis, Jawa Barat. Pelanggan memeriksa transaksi sendiri dan memasukkan PIN sendiri secara rahasia, serta menerima struk sebagai bukti transaksi.
        </p>
